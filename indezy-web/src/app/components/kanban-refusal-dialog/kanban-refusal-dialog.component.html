<div class="refusal-dialog">
  <h2 mat-dialog-title>
    <mat-icon>{{ icons[data.status] }}</mat-icon>
    {{ 'kanban.refusalTitle.' + data.status | translate }}
  </h2>

  <mat-dialog-content>
    <p class="project-role">{{ data.role }}</p>

    <form [formGroup]="refusalForm" (ngSubmit)="onConfirm()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'projects.lostReason.label' | translate }}</mat-label>
        <mat-select formControlName="lostReason" data-lost-reason-field>
          <mat-option [value]="null">{{ 'projects.lostReason.none' | translate }}</mat-option>
          @for (reason of lostReasons; track reason) {
            <mat-option [value]="reason">
              {{ 'projects.lostReason.' + reason | translate }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">
      {{ 'common.cancel' | translate }}
    </button>
    <button mat-flat-button color="primary" (click)="onConfirm()" data-refusal-confirm>
      {{ 'common.confirm' | translate }}
    </button>
  </mat-dialog-actions>
</div>
