<div class="app-container">
  @if (authService.isAuthenticated()) {
    <!-- Top Navigation -->
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-button"
        [attr.aria-label]="'nav.toggleMenu' | translate">
        <mat-icon>menu</mat-icon>
      </button>
      <a routerLink="/dashboard" class="app-logo-link">
        <img src="assets/images/indezy-logo.svg" alt="Indezy" class="app-logo" height="32">
      </a>
      <span class="spacer"></span>
      <button mat-icon-button (click)="toggleTheme()" class="theme-button"
        [attr.aria-label]="(themeService.isDark() ? 'theme.useLight' : 'theme.useDark') | translate"
        [matTooltip]="(themeService.isDark() ? 'theme.useLight' : 'theme.useDark') | translate">
        <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <!-- Language Switcher -->
      <button mat-icon-button [matMenuTriggerFor]="langMenu" class="lang-button"
        [attr.aria-label]="'language.switch' | translate">
        <mat-icon>language</mat-icon>
      </button>
      <mat-menu #langMenu="matMenu">
        <button mat-menu-item (click)="switchLanguage('fr')" [class.active-lang]="currentLang === 'fr'">
          <span>{{ 'language.fr' | translate }}</span>
        </button>
        <button mat-menu-item (click)="switchLanguage('en')" [class.active-lang]="currentLang === 'en'">
          <span>{{ 'language.en' | translate }}</span>
        </button>
      </mat-menu>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
        <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>{{ 'nav.profile' | translate }}</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>{{ 'nav.logout' | translate }}</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    <!-- Sidenav Container -->
    <mat-sidenav-container class="app-sidenav-container">
      <mat-sidenav #sidenav
        class="app-sidenav"
        [mode]="isCompactLayout ? 'over' : 'side'"
        [opened]="!isCompactLayout">
        <mat-nav-list>
          @for (item of menuItems; track item.route) {
            <a mat-list-item
              [routerLink]="item.route"
              routerLinkActive="active-nav-item"
              (click)="isCompactLayout && sidenav.close()">
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.labelKey | translate }}</span>
            </a>
          }
        </mat-nav-list>
      </mat-sidenav>
      <!-- Main Content -->
      <mat-sidenav-content class="app-main-content">
        <div class="app-content">
          <router-outlet></router-outlet>
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  } @else {
    <router-outlet></router-outlet>
  }
</div>
