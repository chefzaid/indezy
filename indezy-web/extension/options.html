<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indezy</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle"></h1>
    <form id="form">
      <label for="base" data-i18n="optionsBase"></label>
      <input id="base" type="url" required autocomplete="url" aria-describedby="hint status">
      <p id="hint" class="hint" data-i18n="optionsHint"></p>
      <button type="submit" data-i18n="optionsSave"></button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
