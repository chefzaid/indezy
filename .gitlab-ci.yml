workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - test
  - publish
  - deploy
  - verify

default:
  tags:
    - bm-cluster
  interruptible: true

variables:
  APP_VERSION: "$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.cache/maven"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

validate:manifests:
  stage: validate
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  before_script:
    - apk add --no-cache kubectl
  script:
    - kubectl kustomize infra/k8s >/dev/null
    - kubectl apply --dry-run=client --validate=false -f infra/argocd/indezy-app.yaml >/dev/null

test:server:
  stage: test
  image: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
  cache:
    key: indezy-maven-v1
    paths:
      - .cache/maven/
    policy: pull-push
  before_script:
    - cd indezy-server
  script:
    - ./mvnw --batch-mode clean verify
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: indezy-server/target/surefire-reports/*.xml

test:web:
  stage: test
  image: docker.io/library/node@sha256:ad6400dee476b06e82d0ee3a088e2d7555f6e6569c346e61d69e14d0f19e8c2b
  variables:
    CHROME_BIN: /tmp/chromium-ci
  cache:
    key: indezy-npm-v1
    paths:
      - .cache/npm/
    policy: pull-push
  before_script:
    - apk add --no-cache chromium
    - printf '%s\n' '#!/bin/sh' 'exec /usr/bin/chromium-browser --no-sandbox --disable-dev-shm-usage "$@"' > "$CHROME_BIN"
    - chmod +x "$CHROME_BIN"
    - cd indezy-web
    - npm ci
  script:
    - npm run lint
    - npm test -- --watch=false --browsers=ChromeHeadless
    - npm run build -- --configuration=production

.publish-image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$BUILD_CONTEXT"
      --dockerfile "$DOCKERFILE"
      --target production
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$APP_VERSION"
      --snapshot-mode=redo
      --use-new-run
      --cleanup
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:server:
  extends: .publish-image
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR/indezy-server"
    DOCKERFILE: "$CI_PROJECT_DIR/indezy-server/Dockerfile"
    IMAGE_NAME: indezy-server

publish:web:
  extends: .publish-image
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR/indezy-web"
    DOCKERFILE: "$CI_PROJECT_DIR/indezy-web/Dockerfile"
    IMAGE_NAME: indezy-web

deploy:gitops:
  stage: deploy
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  resource_group: indezy-production
  before_script:
    - apk add --no-cache git kubectl
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - test "$CI_COMMIT_SHA" = "$(git rev-parse "origin/$CI_DEFAULT_BRANCH")"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - infra/scripts/set-image-tags.sh "$APP_VERSION"
    - git config user.name "Indezy GitLab CI"
    - git config user.email "gitlab-ci@swirlit.dev"
    - git add infra/k8s/kustomization.yaml
    - 'git commit -m "deploy: $APP_VERSION [skip ci]"'
    - git push origin "HEAD:$CI_DEFAULT_BRANCH"
    - DEPLOY_REVISION="$(git rev-parse HEAD)"
    - printf 'DEPLOY_REVISION=%s\n' "$DEPLOY_REVISION" > deploy.env
    - kubectl apply -f infra/argocd/indezy-app.yaml
    - kubectl annotate application indezy -n infra argocd.argoproj.io/refresh=hard --overwrite
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify:rollout:
  stage: verify
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  before_script:
    - apk add --no-cache curl jq kubectl
  script:
    - |
      set -eu
      deadline=$(( $(date +%s) + 900 ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        application="$(kubectl get application indezy -n infra -o json 2>/dev/null || true)"
        revision="$(printf '%s' "$application" | jq -r '.status.sync.revision // empty')"
        sync="$(printf '%s' "$application" | jq -r '.status.sync.status // empty')"
        health="$(printf '%s' "$application" | jq -r '.status.health.status // empty')"
        printf 'Argo CD: revision=%s sync=%s health=%s\n' "${revision:-unknown}" "${sync:-unknown}" "${health:-unknown}"
        if [ "$revision" = "$DEPLOY_REVISION" ] && [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
          break
        fi
        sleep 10
      done
      [ "$revision" = "$DEPLOY_REVISION" ] && [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]
    - curl --fail --silent --show-error http://indezy-server.apps.svc.cluster.local:8080/api/actuator/health >/dev/null
    - curl --fail --silent --show-error http://indezy-web.apps.svc.cluster.local:8080/health >/dev/null
  needs:
    - job: deploy:gitops
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
