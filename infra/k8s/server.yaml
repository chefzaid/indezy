apiVersion: v1
kind: ConfigMap
metadata:
  name: indezy-server-config
  namespace: apps
  labels:
    app: indezy-server
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.swirlit.internal:5432/indezy"
  SPRING_DATASOURCE_USERNAME: indezy_user
  INDEZY_SECURITY_KEYCLOAK_ISSUER: https://keycloak.swirlit.dev/auth/realms/swirlit
  INDEZY_SECURITY_KEYCLOAK_JWK_SET_URI: http://keycloak.swirlit.internal:8080/auth/realms/swirlit/protocol/openid-connect/certs
  INDEZY_SECURITY_KEYCLOAK_AUDIENCE: oauth2-proxy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indezy-server
  namespace: apps
  labels:
    app: indezy-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indezy-server
  template:
    metadata:
      labels:
        app: indezy-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: indezy-registry-auth
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.swirlit.internal -p 5432 -U indezy_user -d indezy; do
                echo "Waiting for infrastructure postgres (indezy db)..."; sleep 3
              done
      containers:
        - name: indezy-server
          image: registry.swirlit.dev/swirlit/indezy/indezy-server:initial
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: indezy-server-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: indezy-server-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: indezy-server-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indezy-server-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: indezy-server-secret
                  key: JWT_SECRET
            - name: INDEZY_SECURITY_KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: indezy-server-config
                  key: INDEZY_SECURITY_KEYCLOAK_ISSUER
            - name: INDEZY_SECURITY_KEYCLOAK_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: indezy-server-config
                  key: INDEZY_SECURITY_KEYCLOAK_JWK_SET_URI
            - name: INDEZY_SECURITY_KEYCLOAK_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: indezy-server-config
                  key: INDEZY_SECURITY_KEYCLOAK_AUDIENCE
          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: indezy-server
  namespace: apps
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: indezy-server
