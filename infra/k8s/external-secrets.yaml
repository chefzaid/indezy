apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indezy-registry-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: indezy-registry-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: registry
      remoteRef:
        key: apps/indezy/registry
        property: registry
    - secretKey: username
      remoteRef:
        key: apps/indezy/registry
        property: username
    - secretKey: password
      remoteRef:
        key: apps/indezy/registry
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indezy-server-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: indezy-server-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: apps/indezy/runtime
        property: database_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: apps/indezy/runtime
        property: jwt_secret

---
# The Resend key of the saved search emails (docs/deployment.md#saved-search-email-credentials): an empty value sends
# nothing. Its Vault field must exist, even empty, or this secret fails to sync and Argo CD reports the app degraded.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indezy-mail
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: indezy-mail
    creationPolicy: Owner
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: apps/indezy/mail
        property: RESEND_API_KEY

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indezy-db-admin-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: indezy-db-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_ADMIN_USER
      remoteRef:
        key: infra/postgres
        property: username
    - secretKey: POSTGRES_ADMIN_PASSWORD
      remoteRef:
        key: infra/postgres
        property: password
