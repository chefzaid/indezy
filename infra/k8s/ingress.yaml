apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: indezy-ingress
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    gethomepage.dev/description: Business workflow and management application
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://indezy.swirlit.dev
    gethomepage.dev/icon: mdi-domain
    gethomepage.dev/name: Indezy
    gethomepage.dev/pod-selector: app=indezy-web
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - indezy.swirlit.dev
      secretName: swirlit-dev-tls
  rules:
    - host: indezy.swirlit.dev
      http:
        paths:
          # Route everything else to the Angular frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: indezy-web
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: indezy-api-ingress
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.swirlit.internal:4180/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://keycloak.swirlit.dev/oauth2/start?rd=https://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Auth-Request-Access-Token
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - indezy.swirlit.dev
      secretName: swirlit-dev-tls
  rules:
    - host: indezy.swirlit.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: indezy-server
                port:
                  number: 8080
