apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: indezy-ingress
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    gethomepage.dev/description: Business workflow and management application
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://indezy.swirlit.dev
    gethomepage.dev/icon: mdi-domain
    gethomepage.dev/name: Indezy
    gethomepage.dev/weight: "40"
    gethomepage.dev/pod-selector: app=indezy-web
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: apps-indezy-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - indezy.swirlit.dev
      secretName: swirlit-dev-tls
  rules:
    - host: indezy.swirlit.dev
      http:
        paths:
          # Route everything else to the Angular frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: indezy-web
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: indezy-api-ingress
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: apps-indezy-sso@kubernetescrd,apps-indezy-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - indezy.swirlit.dev
      secretName: swirlit-dev-tls
  rules:
    - host: indezy.swirlit.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: indezy-server
                port:
                  number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: indezy-upload-limit
  namespace: apps
spec:
  buffering:
    maxRequestBodyBytes: 16777216
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: indezy-sso
  namespace: apps
spec:
  forwardAuth:
    # The proxy's static upstream preserves login return URLs and backend 401s.
    address: http://oauth2-proxy.swirlit.internal:4180/
    trustForwardHeader: true
    preserveLocationHeader: true
    forwardBody: false
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Auth-Request-Access-Token
    addAuthCookiesToResponse:
      - _oauth2_proxy
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: indezy-backend
  namespace: apps
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 120s
