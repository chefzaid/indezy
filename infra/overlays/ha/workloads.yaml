apiVersion: apps/v1
kind: Deployment
metadata:
  name: indezy-server
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app: indezy-server
      containers:
      - name: indezy-server
        env:
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: validate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indezy-web
  namespace: apps
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app: indezy-web
