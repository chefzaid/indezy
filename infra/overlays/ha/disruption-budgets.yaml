apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: indezy-server
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: indezy-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: indezy-web
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: indezy-web
