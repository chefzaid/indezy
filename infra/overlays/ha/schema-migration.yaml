apiVersion: batch/v1
kind: Job
metadata:
  name: indezy-schema-migration
  namespace: apps
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: indezy-schema-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: indezy-registry-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-migration
          # Replaced from the rendered API image by kustomization.yaml.
          image: registry.swirlit.dev/swirlit/indezy/indezy-server:initial
          command: ["java", "-XX:MaxRAMPercentage=75.0", "-jar", "/app/app.jar"]
          envFrom:
            - configMapRef:
                name: indezy-server-config
          env:
            - name: INDEZY_SCHEMA_MIGRATION_ONLY
              value: "true"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indezy-server-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: indezy-server-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
