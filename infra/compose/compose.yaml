# Local development services: PostgreSQL for `mask run`, plus pgAdmin (profile `admin`) and the development
# container (profile `devcontainer`). Ports are published on 127.0.0.1 only.

services:
  postgres:
    # The major version production runs (infra/k8s); a volume made by an older major version needs `down -v`.
    image: postgres:18-alpine
    container_name: indezy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indezy}
      POSTGRES_USER: ${POSTGRES_USER:-indezy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indezy_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder under /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indezy_user} -d ${POSTGRES_DB:-indezy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: indezy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@indezy.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../../.devcontainer/pgadmin-servers.json:/pgadmin4/servers.json:ro
    profiles:
      - admin

  devcontainer:
    build:
      context: ../../.devcontainer
      dockerfile: Dockerfile
    container_name: indezy-devcontainer
    volumes:
      - ../..:/workspace:cached
      # Caches of the container's vscode user, kept across rebuilds.
      - maven-cache:/home/vscode/.m2
      - node-cache:/home/vscode/.npm
      - playwright-cache:/home/vscode/.cache/ms-playwright
      - vscode-extensions:/home/vscode/.vscode-server/extensions
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=devcontainer
    profiles:
      - devcontainer

volumes:
  postgres_data:
  pgadmin_data:
  maven-cache:
  node-cache:
  playwright-cache:
  vscode-extensions:
