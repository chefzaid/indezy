# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
# 'create' (not 'create-drop'): the integration tests share one in-memory DB across
# Spring contexts. create-drop's drop-on-shutdown (fired by @DirtiesContext teardown)
# would wipe the shared schema, so a later test reusing a cached context finds no tables.
# 'create' rebuilds the schema on each context startup and never drops it on shutdown;
# each test re-seeds its own data via @Sql, so this keeps tests order-independent.
spring.jpa.hibernate.ddl-auto=create

# Tables and columns named exactly as the entities declare them, not through Spring's camelCase-to-snake_case strategy.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Logging: the application at DEBUG too, so the log tests prove personal data stays out at every level.
logging.level.dev.swirlit.indezy=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Security: required for unauthenticated TestRestTemplate calls in integration tests.
indezy.security.permit-all=true

# No background jobs in tests.
indezy.scheduling-enabled=false
# Job offer collection: no background reading of the job boards and no geocoding calls in tests.
indezy.offers.collection-enabled=false
indezy.offers.geocoding-enabled=false
indezy.projects.archiving-enabled=false
indezy.contacts.retention-enabled=false
indezy.webhooks.allow-private-addresses=true
indezy.webhooks.delivery-enabled=false
indezy.companies.url=http://127.0.0.1:9
