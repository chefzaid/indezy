spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/indezy
    username: ${DB_USERNAME:indezy_user}
    password: ${DB_PASSWORD:indezy_password}

  jpa:
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

jwt:
  secret: ${JWT_SECRET:indezy-devcontainer-secret-key-for-development-only}

logging:
  level:
    "[dev.swirlit.indezy]": DEBUG
    "[org.springframework.security]": INFO
    "[org.hibernate.SQL]": INFO
    "[org.springframework.web]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
