server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  application:
    name: indezy-server
  lifecycle:
    timeout-per-shutdown-phase: 20s
  
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:indezy}
    username: ${POSTGRES_USER:indezy_user}
    password: ${POSTGRES_PASSWORD:indezy_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    # Entities are loaded and mapped inside transactional services; never lazily in views.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  
  servlet:
    multipart:
      # Opportunities' files go up to 10 MB (avatars stay under 512 KB in UserService).
      max-file-size: 10MB
      max-request-size: 11MB

jwt:
  secret: ${JWT_SECRET:indezy-super-secret-key-change-in-production}
  expiration: 86400000 # 24 hours in milliseconds

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

indezy:
  # Runs scheduled work at all: the jobs switched below, webhook deliveries, nightly clean-ups, digests and emails.
  scheduling-enabled: ${INDEZY_SCHEDULING_ENABLED:true}
  contacts:
    # Anonymizes every night the dormant contacts of the accounts that set a retention period (see docs/features.md#contact-privacy).
    retention-enabled: ${INDEZY_CONTACTS_RETENTION_ENABLED:true}
  projects:
    # Archives every night the idle opportunities of the accounts that asked for it (see docs/features.md#kanban-and-pipeline-view).
    archiving-enabled: ${INDEZY_PROJECTS_ARCHIVING_ENABLED:true}
  offers:
    # Reads the job boards in the background (see docs/features.md#freelance-offer-feed).
    collection-enabled: ${INDEZY_OFFERS_COLLECTION_ENABLED:true}
    # Locates offer cities through geo.api.gouv.fr (French government, no key).
    geocoding-enabled: ${INDEZY_OFFERS_GEOCODING_ENABLED:true}
  admin:
    # Accounts that open the admin console, by email (comma-separated); none by default.
    emails: ${INDEZY_ADMIN_EMAILS:}
  mail:
    # Saved search emails go through Resend (see docs/deployment.md#saved-search-email-credentials); without a key
    # nothing is sent and the app says so.
    resend-api-key: ${RESEND_API_KEY:}
    from: ${INDEZY_MAIL_FROM:Indezy <noreply@swirlit.dev>}
    public-url: ${INDEZY_PUBLIC_URL:https://indezy.swirlit.dev}

cors:
  allowed-origins: 
    - http://localhost:4200
    - http://127.0.0.1:4200
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      # Probes only need UP/DOWN; full component details require authentication to avoid leaking internals.
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # A few buckets per route, so Prometheus can tell the share of slow requests and alert on the 95th percentile
      # (swirl-cloud's IndezyApiSlow) without a full histogram's hundred series per route.
      slo:
        "[http.server.requests]": 100ms,250ms,500ms,1s,2s,5s

logging:
  level:
    # Production logs the application at INFO: its DEBUG lines are for development (the devcontainer and test profiles).
    "[dev.swirlit.indezy]": INFO
    "[org.springframework.security]": WARN
    "[org.springframework.web]": WARN
    # Logs each resolved exception's message at DEBUG, rejected values included: GlobalExceptionHandler logs a safe line.
    "[org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver]": INFO
    "[org.hibernate.SQL]": WARN
