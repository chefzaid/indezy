spring:
  jpa:
    # The seed profile is intentionally destructive. Hibernate recreates the schema
    # before Spring runs data-dev.sql.
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql
      continue-on-error: false

indezy:
  # A one-off run: no background jobs.
  scheduling-enabled: false
  contacts:
    # A one-off run: never anonymize contacts.
    retention-enabled: false
  projects:
    # A one-off run: never archive opportunities.
    archiving-enabled: false
  offers:
    # A one-off run: never start reading the job boards.
    collection-enabled: false
